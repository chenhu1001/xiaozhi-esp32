services:
  ancs-relay-server:
    build: .
    image: xiaozhi/ancs-relay-server:local
    container_name: xiaozhi-ancs-relay-server
    restart: unless-stopped
    ports:
      - "${ANCS_HOST_PORT:-18081}:8080"
    environment:
      ANCS_LISTEN_ADDR: ":8080"
      ANCS_DB_FILE: "/data/ancs.db"
    volumes:
      - "${ANCS_DATA_DIR:-./data}:/data"
